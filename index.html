<!DOCTYPE html>  <!--文档类型声明，告诉浏览器：当前文档是HTML5文档。不是HTML标签，没有闭合标签-->
<html lang="zh-CN"> <!-- html根标签，整个网页所有内容都写在这个标签内部；lang="zh-CN" 属性：页面语言为简体中文-->
  <head> <!--head头部标签：存放网页【元信息】，内容不会直接显示在页面上，给浏览器、搜索引擎读取-->
    <meta charset="UTF-8"> <!--meta元数据标签；charset属性：指定网页字符编码为UTF-8，防止中文乱码-->
    <title>我的第一个网页</title> <!--title标题标签；文字显示在浏览器标签栏，不会出现在页面主体-->
    
    <link rel="stylesheet" href="style.css">

  </head>
  <body> <!--body主体标签：所有要展示给用户看到的页面内容，全部写在这里-->
    <div class="card"> <!--上边的CSS样式中定义了一个名为card的类，这里使用div标签创建一个容器，并应用card类的样式-->
      
      <h1>你好，互联网，你好，世界！</h1> <!-- h1 一级标题标签；页面最大标题，一个页面建议只写1个h1 -->
      <p>这是我的第一个网页，现在它已经上线了！ ：D</p> <!--p段落标签，包裹一段文本，自带段落上下间距-->
      <p>你好，git！
      <p>                        ⬇️
      <p id="msg">现在它有了一点样式
      <button onclick="changeText()">点我试试
      </button>
      
    </div>
    <script src="script.js"></script>
  </body>
</html> <!--html根标签的闭合标签，代表整个网页结束
